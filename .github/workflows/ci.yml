name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # devbox provisions the exact local toolchain — rustup + ripgrep per
      # devbox.json, versions pinned by devbox.lock — so CI matches the dev
      # environment (determinism: same manifest -> same corpus -> same gates).
      # No separate toolchain action, no manual package installs.
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@v2
      - run: devbox run -- cargo fmt --check
      - run: devbox run -- cargo clippy --all-targets -- -D warnings
      - run: devbox run -- cargo test
